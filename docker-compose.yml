# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis (+ nginx nếu làm phần cộng điểm)
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# NHIỆM VỤ: bổ sung service `agent`. Yêu cầu:
#   [ ] build từ Dockerfile trong thư mục hiện tại
#   [ ] map cổng ra ngoài (8000:8000)
#   [ ] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${AGENT_API_KEY}` (docker compose tự đọc từ file .env cùng thư mục)
#   [ ] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [ ] depends_on: redis
#   [ ] healthcheck gọi /health
#
# MỞ RỘNG TÙY CHỌN: thêm service `nginx` làm load balancer
# (không phải bonus chấm điểm riêng; nginx/nginx.conf đã có sẵn)
#     docker compose up --scale agent=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Nội suy biến môi trường: compose đọc từ file .env cùng thư mụng,
      # khóa KHÔNG nằm trong file này.
      AGENT_API_KEY: ${AGENT_API_KEY}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        # Chỉ khởi động agent khi Redis đã trả lời ping
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Load balancer tùy chọn. Bật lên rồi scale agent ra nhiều bản:
  #     docker compose up -d --scale agent=3
  # rồi gọi qua cổng 80 thay vì 8000.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  redis-data:
