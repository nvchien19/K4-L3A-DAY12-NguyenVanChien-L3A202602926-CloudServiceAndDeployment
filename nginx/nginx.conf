# CHO SẴN — cấu hình Nginx cho phần mở rộng load balancer tùy chọn của CP4.
#
# `docker compose up --scale agent=3` tạo 3 container cùng tên service `agent`.
# Docker DNS trả về cả 3 IP cho hostname `agent`, Nginx lần lượt gửi request
# tới từng IP (round-robin). Đây là lý do app phải stateless: hai request liên
# tiếp của cùng một user có thể rơi vào hai container khác nhau.

events {
    worker_connections 1024;
}

http {
    # KHÔNG khai báo `upstream { server agent:8000; }`.
    #
    # Ở đây nginx chỉ resolve hostname `agent` MỘT LẦN lúc khởi động rồi giữ
    # nguyên IP đó. Lúc `docker compose up --scale agent=3`, Docker DNS trả về
    # 3 IP cho `agent`, nhưng nginx vẫn chỉ đẩy traffic về container khởi động
    # đầu tiên — hai container còn lại đứng không.
    #
    # Cách đúng cho Compose: bỏ hẳn khối `upstream` và đưa thẳng hostname vào
    # `proxy_pass`. Khi đó nginx resolve `agent` ở mỗi request, nhận đủ 3 IP
    # và chuyển vòng xoay (round-robin) giữa chúng. Đây là cơ chế xử lý DNS
    # runtime của nginx, không phụ thuộc bản nginx có hỗ trợ `resolve` hay không.
    #
    # Hệ quả trực tiếp của việc round-robin: hai lượt hỏi liên tiếp của cùng
    # một user có thể rơi vào hai container khác nhau. Chỉ khi state nằm ở
    # Redis (CP4) thì agent mới "nhớ" được nối tiếp.
    server {
        listen 80;

        # Nginx tự bỏ instance trả lỗi ra khỏi vòng xoay trong 30 giây
        proxy_next_upstream error timeout http_502 http_503;

        location /health {
            proxy_pass http://agent:8000/health;
        }

        location / {
            proxy_pass http://agent:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
